kotlin.code.style=official

# Kotlin/Native allocator: allocate per object instead of 128 KiB size-class pages.
# kontainer processes are short-lived; the paged allocator spent ~40 mmaps and
# ~4.7 MiB RSS per invocation on pages that stay mostly empty. Measured on this
# machine: state 2.2 -> 1.5 ms, run (warm) 12.3 -> 8.7 ms, peak RSS 10.9 -> 6.1 MiB.
kotlin.native.binary.pagedAllocator=false
