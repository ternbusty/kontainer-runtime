kotlin.code.style=official

# Kotlin/Native allocator: allocate per object instead of 128 KiB size-class pages.
# kontainer processes are short-lived; the paged allocator maps one 128 KiB page
# per object size class touched, most of which stay nearly empty, so startup
# time and peak RSS both go up. See docs/kotlin-native-allocator.md.
kotlin.native.binary.pagedAllocator=false
