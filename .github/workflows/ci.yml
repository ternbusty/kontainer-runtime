name: CI

on:
  pull_request:
    branches: [ main ]
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libseccomp-dev

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run ktlintFormat
        run: ./gradlew ktlintFormat

      - name: Run ktlintCheck
        run: ./gradlew ktlintCheck

      - name: Run tests
        run: ./gradlew linuxX64Test

      # Fail if the test task silently ran zero tests
      - name: Verify tests actually ran
        run: |
          count=$(grep -ho '<testcase ' build/test-results/linuxX64Test/TEST-*.xml 2>/dev/null | wc -l)
          echo "Executed test cases: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::No test cases were executed. Check that linuxX64Test still runs the Kotest specs."
            exit 1
          fi

      - name: Build release binary
        run: ./gradlew linkReleaseExecutableLinuxX64
