name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: linuxX64
            targetArch: x86_64
            static: false
            pkgs: "libseccomp-dev"
          - target: linuxArm64
            targetArch: aarch64
            static: false
            pkgs: "libseccomp-dev gcc-aarch64-linux-gnu libc6-dev:arm64 libseccomp-dev:arm64"
          # Fully static binaries (-Pstatic): libseccomp is built from source
          # against the Kotlin/Native sysroot, so no libseccomp-dev here.
          - target: linuxX64
            targetArch: x86_64
            static: true
            pkgs: ""
          - target: linuxArm64
            targetArch: aarch64
            static: true
            pkgs: "gcc-aarch64-linux-gnu libc6-dev:arm64"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Add arm64 architecture
        if: matrix.targetArch == 'aarch64'
        run: |
          sudo dpkg --add-architecture arm64
          # The runner's default sources only carry amd64.  Pin them so apt
          # does not try to fetch arm64 from mirrors that lack it, and add
          # ports.ubuntu.com for the arm64 packages we actually need.
          sudo sed -i '/^Types: deb$/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          printf '%s\n' \
            "Types: deb" \
            "Architectures: arm64" \
            "URIs: http://ports.ubuntu.com/ubuntu-ports" \
            "Suites: noble noble-updates noble-security noble-backports" \
            "Components: main universe restricted multiverse" \
            "Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg" \
          | sudo tee /etc/apt/sources.list.d/arm64.sources >/dev/null

      - name: Install dependencies
        if: matrix.pkgs != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.pkgs }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run ktlintCheck
        if: matrix.targetArch == 'x86_64' && !matrix.static
        run: ./gradlew ktlintCheck

      - name: Run tests
        if: matrix.targetArch == 'x86_64' && !matrix.static
        run: ./gradlew linuxX64Test

      - name: Build release binary
        run: ./gradlew linkReleaseExecutable${{ matrix.target }} -PtargetArch=${{ matrix.targetArch }} ${{ matrix.static && '-Pstatic' || '' }}

      - name: Verify static binary
        if: matrix.static
        run: |
          bin=build/bin/${{ matrix.target }}/releaseExecutable/kontainer-runtime.kexe
          file "$bin"
          file "$bin" | grep -q 'statically linked'
          # No shared-library dependencies and no glibc symbol-version requirements.
          if readelf -d "$bin" | grep -q NEEDED; then echo "unexpected DT_NEEDED"; exit 1; fi
          if readelf -V "$bin" | grep -q 'GLIBC_'; then echo "unexpected glibc version need"; exit 1; fi
          # Every weak pthread reference must have been forced in (see build.gradle.kts).
          if nm "$bin" | awk '$1=="w"{print $2}' | grep -E '^(_*pthread_|__call_tls)'; then echo "unresolved weak pthread symbols"; exit 1; fi
          if [ "${{ matrix.targetArch }}" = x86_64 ]; then "$bin" --version; fi

      - name: Upload x86_64 binary
        if: matrix.targetArch == 'x86_64' && !matrix.static
        uses: actions/upload-artifact@v7
        with:
          name: kontainer-runtime-x86_64
          path: build/bin/linuxX64/releaseExecutable/kontainer-runtime.kexe
          retention-days: 1

      - name: Upload static binary
        if: matrix.static
        uses: actions/upload-artifact@v7
        with:
          name: kontainer-runtime-${{ matrix.targetArch }}-static
          path: build/bin/${{ matrix.target }}/releaseExecutable/kontainer-runtime.kexe
          retention-days: 1

  # ── Downstream test suites (reuse the x86_64 binary built above) ──

  integration:
    needs: build
    uses: ./.github/workflows/integration.yml

  oci-validation:
    needs: build
    uses: ./.github/workflows/oci-validation.yml

  runc-bats:
    needs: build
    uses: ./.github/workflows/runc-compat.yml
