name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: linuxX64
            targetArch: x86_64
            crossPkgs: ""
          - target: linuxArm64
            targetArch: aarch64
            crossPkgs: "gcc-aarch64-linux-gnu libc6-dev:arm64 libseccomp-dev:arm64"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Add arm64 architecture
        if: matrix.targetArch == 'aarch64'
        run: |
          sudo dpkg --add-architecture arm64
          # The runner's default sources only carry amd64.  Pin them so apt
          # does not try to fetch arm64 from mirrors that lack it, and add
          # ports.ubuntu.com for the arm64 packages we actually need.
          sudo sed -i '/^Types: deb$/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          printf '%s\n' \
            "Types: deb" \
            "Architectures: arm64" \
            "URIs: http://ports.ubuntu.com/ubuntu-ports" \
            "Suites: noble noble-updates noble-security noble-backports" \
            "Components: main universe restricted multiverse" \
            "Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg" \
          | sudo tee /etc/apt/sources.list.d/arm64.sources >/dev/null

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libseccomp-dev ${{ matrix.crossPkgs }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run ktlintCheck
        if: matrix.targetArch == 'x86_64'
        run: ./gradlew ktlintCheck

      - name: Run tests
        if: matrix.targetArch == 'x86_64'
        run: ./gradlew linuxX64Test

      - name: Build release binary
        run: ./gradlew linkReleaseExecutable${{ matrix.target }} -PtargetArch=${{ matrix.targetArch }}

      - name: Upload x86_64 binary
        if: matrix.targetArch == 'x86_64'
        uses: actions/upload-artifact@v7
        with:
          name: kontainer-runtime-x86_64
          path: build/bin/linuxX64/releaseExecutable/kontainer-runtime.kexe
          retention-days: 1

  # ── Downstream test suites (reuse the x86_64 binary built above) ──

  integration:
    needs: build
    uses: ./.github/workflows/integration.yml

  oci-validation:
    needs: build
    uses: ./.github/workflows/oci-validation.yml

  runc-bats:
    needs: build
    uses: ./.github/workflows/runc-compat.yml
