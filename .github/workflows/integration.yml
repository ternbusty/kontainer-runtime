name: Integration Tests

on:
  workflow_call:

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download kontainer-runtime binary
        uses: actions/download-artifact@v8
        with:
          name: kontainer-runtime-x86_64
          path: build/bin/linuxX64/releaseExecutable

      - name: Make binary executable
        run: chmod +x build/bin/linuxX64/releaseExecutable/kontainer-runtime.kexe

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq containerd

      - name: Make verify scripts executable
        run: chmod +x test-scripts/*.sh

      - name: Start containerd
        run: |
          sudo systemctl enable containerd
          sudo systemctl start containerd
          sudo systemctl status containerd --no-pager

      - name: Pull alpine image
        run: sudo ctr image pull docker.io/library/alpine:latest

      - name: Run container, host-side and exec verification
        run: |
          BIN="$(pwd)/build/bin/linuxX64/releaseExecutable/kontainer-runtime.kexe"
          START="$(date '+%Y-%m-%d %H:%M:%S')"

          # On any failure below, record what the container, containerd and the
          # runtime were doing, so a hang or a slow start can be told apart.
          dump_diagnostics() {
            echo "::group::Diagnostics ($(date -u +%T))"
            echo "--- ctr tasks / containers ---"
            sudo ctr tasks ls || true
            sudo ctr containers ls || true
            echo "--- processes ---"
            ps -eo pid,ppid,stat,etimes,wchan:32,args --forest || true
            # Kernel stacks of the runtime's processes: those executing the
            # binary itself or its sealed memfd copy (the container init).
            for d in /proc/[0-9]*; do
              exe=$(sudo readlink "$d/exe" 2>/dev/null) || continue
              case "$exe" in
                *kontainer-runtime.kexe*|/memfd:*) ;;
                *) continue ;;
              esac
              echo "--- pid ${d#/proc/} ($exe): $(tr '\0' ' ' < "$d/cmdline" 2>/dev/null | cut -c1-200)"
              sudo cat "$d/stack" 2>/dev/null | head -12 || true
            done
            echo "--- runtime log.json ---"
            sudo cat /run/containerd/io.containerd.runtime.v2.task/default/test-verify/log.json 2>/dev/null || true
            echo "--- containerd journal ---"
            sudo journalctl -u containerd --since "$START" --no-pager | tail -100 || true
            echo "--- container.log so far ---"
            cat container.log || true
            echo "::endgroup::"
          }
          trap dump_diagnostics ERR

          # Start the container in the background. verify-from-container.sh ends
          # with `sleep 30`, giving the host and exec scripts a window to run.
          : > container.log
          sudo ctr run --rm \
              --runc-binary="$BIN" \
              --seccomp --read-only \
              --memory-limit 134217728 --cpus 0.5 \
              --uidmap "0:100000:65536" --gidmap "0:100000:65536" \
              --user 1000:1000 --hostname my-test-container \
              docker.io/library/alpine:latest \
              test-verify \
              sh -c "$(cat test-scripts/verify-from-container.sh)" \
              > container.log 2>&1 &
          CTR_PID=$!
          echo "ctr PID: $CTR_PID"

          # Wait until the container has run its checks and entered its trailing
          # sleep, instead of a fixed delay. Startup normally takes well under a
          # second; 30 s is only a ceiling that turns a hang into a clear error.
          ready=""
          for _ in $(seq 1 60); do
            if grep -q '^Sleeping for 30 seconds' container.log 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$CTR_PID" 2>/dev/null; then
              echo "::error::ctr exited before the container was ready"
              false
            fi
            sleep 0.5
          done
          if [ -z "$ready" ]; then
            echo "::error::container not ready after 30 s"
            false
          fi
          echo "container ready after $(( $(date +%s) - $(date -d "$START" +%s) )) s"

          sudo ./test-scripts/verify-from-host.sh test-verify > host.log 2>&1
          sudo ./test-scripts/verify-exec.sh test-verify "$BIN" > exec.log 2>&1

          # Wait for the container to finish its trailing sleep and exit.
          wait $CTR_PID

      - name: Show captured logs
        if: always()
        run: |
          echo "=== container.log ==="
          cat container.log || true
          echo ""
          echo "=== host.log ==="
          cat host.log || true
          echo ""
          echo "=== exec.log ==="
          cat exec.log || true

      - name: Check expectations
        run: |
          ./test-scripts/check-expectations.sh container.log
          ./test-scripts/check-expectations.sh host.log
          ./test-scripts/check-expectations.sh exec.log

      - name: Upload logs as artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-logs
          path: |
            container.log
            host.log
            exec.log
