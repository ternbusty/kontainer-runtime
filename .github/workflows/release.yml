name: Release

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # Gate release-please on CI (which includes integration, OCI validation,
  # and runc bats) so a broken main never produces a release / binary upload.
  ci:
    uses: ./.github/workflows/ci.yml

  release-please:
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release-please.outputs.releases_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
      version: ${{ steps.release-please.outputs.version }}
    steps:
      - name: Run release-please
        id: release-please
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - target: linuxX64
            targetArch: x86_64
            artifactArch: amd64
            crossPkgs: ""
            strip: strip
          - target: linuxArm64
            targetArch: aarch64
            artifactArch: arm64
            crossPkgs: "gcc-aarch64-linux-gnu libc6-dev:arm64 libseccomp-dev:arm64"
            strip: aarch64-linux-gnu-strip
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Add arm64 architecture
        if: matrix.targetArch == 'aarch64'
        run: |
          sudo dpkg --add-architecture arm64
          # The runner's default sources only carry amd64.  Pin them so apt
          # does not try to fetch arm64 from mirrors that lack it, and add
          # ports.ubuntu.com for the arm64 packages we actually need.
          sudo sed -i '/^Types: deb$/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          printf '%s\n' \
            "Types: deb" \
            "Architectures: arm64" \
            "URIs: http://ports.ubuntu.com/ubuntu-ports" \
            "Suites: noble noble-updates noble-security noble-backports" \
            "Components: main universe restricted multiverse" \
            "Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg" \
          | sudo tee /etc/apt/sources.list.d/arm64.sources >/dev/null

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libseccomp-dev ${{ matrix.crossPkgs }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release binary
        run: ./gradlew linkReleaseExecutable${{ matrix.target }} -PtargetArch=${{ matrix.targetArch }}

      # The release build already drops debug sections (konan passes -S to the
      # linker) but keeps the symbol table, which is ~1.3 MB of the 5.4 MB
      # binary. Strip it like runc/crun/youki do. Trade-off: uncaught Kotlin
      # exception traces then show raw addresses instead of kfun: names; the
      # unstripped binary is kept as a workflow artifact so addresses can still
      # be resolved with `nm -n` against the matching build.
      - name: Strip symbol table
        run: |
          bin=build/bin/${{ matrix.target }}/releaseExecutable/kontainer-runtime.kexe
          cp "$bin" kontainer-runtime-unstripped
          ${{ matrix.strip }} "$bin"
          file "$bin"
          file "$bin" | grep -q ', stripped'
          if [ "${{ matrix.targetArch }}" = x86_64 ]; then "$bin" --version; fi

      - name: Upload unstripped binary
        uses: actions/upload-artifact@v7
        with:
          name: kontainer-runtime-unstripped-${{ matrix.artifactArch }}
          path: kontainer-runtime-unstripped
          retention-days: 90

      - name: Stage binary with versioned name
        run: |
          mkdir -p dist
          cp build/bin/${{ matrix.target }}/releaseExecutable/kontainer-runtime.kexe \
             dist/kontainer-runtime_${{ needs.release-please.outputs.version }}_linux_${{ matrix.artifactArch }}

      - name: Upload binary to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: dist/*
