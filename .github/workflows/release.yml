name: Release

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # Gate release-please on CI (which includes integration, OCI validation,
  # and runc bats) so a broken main never produces a release / binary upload.
  ci:
    uses: ./.github/workflows/ci.yml

  release-please:
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release-please.outputs.releases_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
      version: ${{ steps.release-please.outputs.version }}
    steps:
      - name: Run release-please
        id: release-please
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - target: linuxX64
            targetArch: x86_64
            artifactArch: amd64
            crossPkgs: ""
          - target: linuxArm64
            targetArch: aarch64
            artifactArch: arm64
            crossPkgs: "gcc-aarch64-linux-gnu libseccomp-dev:arm64"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Add arm64 architecture
        if: matrix.targetArch == 'aarch64'
        run: sudo dpkg --add-architecture arm64

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libseccomp-dev ${{ matrix.crossPkgs }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release binary
        run: ./gradlew linkReleaseExecutable${{ matrix.target }} -PtargetArch=${{ matrix.targetArch }}

      - name: Stage binary with versioned name
        run: |
          mkdir -p dist
          cp build/bin/${{ matrix.target }}/releaseExecutable/kontainer-runtime.kexe \
             dist/kontainer-runtime_${{ needs.release-please.outputs.version }}_linux_${{ matrix.artifactArch }}

      - name: Upload binary to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: dist/*
