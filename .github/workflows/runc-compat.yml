name: runc bats compatibility

# Runs a subset of runc's bats integration tests against
# kontainer-runtime to track OCI CLI compatibility.
# The workflow fails if any test fails; results are also reported
# as a Job Summary.

on:
  workflow_call:

jobs:
  runc-bats:
    name: runc bats integration
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      # ── checkout & toolchain ──────────────────────────────────────
      - name: Checkout kontainer-runtime
        uses: actions/checkout@v7

      - name: Download kontainer-runtime binary
        uses: actions/download-artifact@v8
        with:
          name: kontainer-runtime-x86_64
          path: build/bin/linuxX64/releaseExecutable

      - name: Make binary executable
        run: |
          chmod +x build/bin/linuxX64/releaseExecutable/kontainer-runtime.kexe
          BIN="$(pwd)/build/bin/linuxX64/releaseExecutable/kontainer-runtime.kexe"
          echo "KONTAINER_BIN=$BIN" >> "$GITHUB_ENV"

      - name: Set up Go (for runc test helpers)
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Install dependencies
        run: |
          sudo apt-get update || true
          sudo apt-get install -y libseccomp-dev jq sshfs

      # ── clone runc & install bats ─────────────────────────────────
      - name: Clone runc (latest stable)
        run: |
          RUNC_TAG="v$(git ls-remote --tags --sort=-v:refname \
            https://github.com/opencontainers/runc.git 'v[0-9]*' \
            | grep -oP 'refs/tags/v\K[0-9]+\.[0-9]+\.[0-9]+$' | head -1)"
          echo ">>> Using runc $RUNC_TAG"
          git clone --depth 1 --branch "$RUNC_TAG" \
            https://github.com/opencontainers/runc "$HOME/runc"
          echo "RUNC_REPO_DIR=$HOME/runc" >> "$GITHUB_ENV"
          echo "RUNC_TAG=$RUNC_TAG" >> "$GITHUB_ENV"

      - name: Install bats-core
        run: |
          git clone --depth 1 https://github.com/bats-core/bats-core "$HOME/bats-core"
          sudo "$HOME/bats-core/install.sh" /usr/local
          bats --version

      # ── build runc test helper binaries ──────────────────────────
      - name: Build runc test helpers
        run: |
          cd "$HOME/runc"
          # Use runc's own Makefile target — builds all helpers into tests/cmd/_bin/
          make test-binaries
          ls -la tests/cmd/_bin/

      # ── fetch rootfs images ──────────────────────────────────────
      - name: Fetch rootfs images (busybox / debian)
        run: |
          chmod +x "$HOME/runc/tests/integration/get-images.sh"
          "$HOME/runc/tests/integration/get-images.sh" > /dev/null

      # ── run bats tests ───────────────────────────────────────────
      - name: Run runc bats integration tests
        id: bats
        run: |
          chmod +x scripts/runc-compat-test.sh
          sudo env \
            KONTAINER_BIN="$KONTAINER_BIN" \
            RUNC_TAG="$RUNC_TAG" \
            SUMMARY_FILE="$GITHUB_STEP_SUMMARY" \
            TAP_OUTPUT="$PWD/tap-output.log" \
            scripts/runc-compat-test.sh \
              --runc-dir "$RUNC_REPO_DIR" \
              --binary "$KONTAINER_BIN"

      # ── upload raw output ────────────────────────────────────────
      - name: Upload bats TAP output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runc-bats-tap-output
          path: tap-output.log

      # ── report outcome in annotations ────────────────────────────
      - name: Annotate outcome
        if: always()
        run: |
          if [ "${{ steps.bats.outcome }}" = "success" ]; then
            echo "::notice::All runc bats tests passed"
          else
            echo "::warning::Some runc bats tests failed — see Job Summary for details"
          fi

  # ── SELinux tests via Lima + Fedora VM ─────────────────────────
  runc-bats-selinux:
    name: runc bats SELinux (Fedora)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout kontainer-runtime
        uses: actions/checkout@v7

      - name: Download kontainer-runtime binary
        uses: actions/download-artifact@v8
        with:
          name: kontainer-runtime-x86_64
          path: build/bin/linuxX64/releaseExecutable

      - name: Make binary executable
        run: chmod +x build/bin/linuxX64/releaseExecutable/kontainer-runtime.kexe

      # ── Lima VM setup ────────────────────────────────────────────
      - name: Set up Lima
        uses: lima-vm/lima-actions/setup@v1
        id: lima-setup

      - name: Cache Lima VM image
        uses: actions/cache@v6
        with:
          path: ~/.cache/lima
          key: lima-fedora-${{ steps.lima-setup.outputs.version }}

      - name: Start Fedora VM
        run: limactl start --plain --name=default template://fedora

      - name: Provision VM
        run: |
          set -eux -o pipefail

          # Install runtime dependencies inside the VM.
          # libxcrypt-compat provides libcrypt.so.1 required by the Ubuntu-built binary.
          lima sudo dnf -y --setopt=install_weak_deps=False --setopt=tsflags=nodocs \
            install bats git-core jq libseccomp-devel make golang \
                   container-selinux policycoreutils libxcrypt-compat

          # Remount /tmp with suid to avoid SELinux nosuid_transition denials.
          lima sudo mount -o remount,suid /tmp

      - name: Show guest info
        run: |
          set -eux -o pipefail
          lima uname -a
          lima cat /etc/os-release
          lima sestatus
          lima rpm -q container-selinux

      # ── Copy files into the VM ───────────────────────────────────
      - name: Copy binary and test files into VM
        run: |
          set -eux -o pipefail

          # Copy the kontainer-runtime binary as "runc" — selinux.bats does
          # `cp "$RUNC" . && export RUNC="$PWD/runc"` so the filename must
          # be "runc" for the chcon/copy step to work.
          limactl cp build/bin/linuxX64/releaseExecutable/kontainer-runtime.kexe \
            default:/tmp/kontainer-runtime.kexe
          lima sudo install -m 0755 /tmp/kontainer-runtime.kexe /usr/local/bin/runc

          # Copy our test script.
          limactl cp scripts/runc-compat-test.sh default:/tmp/runc-compat-test.sh
          lima sudo chmod +x /tmp/runc-compat-test.sh

      - name: Clone runc and build helpers in VM
        run: |
          set -eux -o pipefail

          # Clone runc (latest stable) inside the VM.
          RUNC_TAG="v$(git ls-remote --tags --sort=-v:refname \
            https://github.com/opencontainers/runc.git 'v[0-9]*' \
            | grep -oP 'refs/tags/v\K[0-9]+\.[0-9]+\.[0-9]+$' | head -1)"
          echo ">>> Using runc $RUNC_TAG"
          lima git clone --depth 1 --branch "$RUNC_TAG" \
            https://github.com/opencontainers/runc /tmp/runc

          # Build test helpers using runc's Makefile.
          lima bash -c 'cd /tmp/runc && make test-binaries'

      # ── Run SELinux bats tests ───────────────────────────────────
      - name: Run runc bats SELinux tests
        id: bats-selinux
        run: |
          ssh -tt lima-default sudo -i env \
            KONTAINER_BIN=/usr/local/bin/runc \
            TAP_OUTPUT=/tmp/selinux-tap.log \
            /tmp/runc-compat-test.sh \
              --runc-dir /tmp/runc \
              --binary /usr/local/bin/runc \
              --selinux

      - name: Retrieve results
        if: always()
        run: |
          limactl cp default:/tmp/selinux-tap.log selinux-tap.log || true

      - name: Upload SELinux bats TAP output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runc-bats-selinux-tap-output
          path: selinux-tap.log

      - name: Annotate outcome
        if: always()
        run: |
          if [ "${{ steps.bats-selinux.outcome }}" = "success" ]; then
            echo "::notice::All SELinux bats tests passed"
          else
            echo "::warning::SELinux bats tests failed — see Job Summary for details"
          fi
