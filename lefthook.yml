pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "*.{kt,kts}"
      run: ./gradlew ktlintFormat
      stage_fixed: true

commit-msg:
  commands:
    conventional-commit:
      run: |
        msg=$(head -1 {1})
        if ! echo "$msg" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|deps)(\(.+\))?!?: .+'; then
          echo "ERROR: Commit message must follow Conventional Commits format:"
          echo ""
          echo "  <type>[optional scope]: <description>"
          echo ""
          echo "  Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert, deps"
          echo ""
          echo "  Examples:"
          echo "    feat: add cgroup v2 support"
          echo "    fix(exec): handle missing tty"
          echo "    docs: update README with CLI usage"
          echo ""
          echo "  Got: $msg"
          exit 1
        fi
